<main>
  <section style="padding-block:40px 96px">
    <div class="wrap">
      <p class="eyebrow">Solo coaches</p>
      <h1 class="h1">Solicitudes del cuestionario</h1>
      <form id="keyForm" class="fields" style="max-width:520px;margin-top:24px" hidden>
        <div class="field full"><label for="key">Clave de coach</label><input id="key" type="password" autocomplete="current-password"></div>
        <div><button class="btn btn-fill" type="submit">Ver solicitudes</button></div>
      </form>
      <div id="bar" style="display:flex;gap:8px;align-items:center;margin:24px 0 16px;flex-wrap:wrap" hidden>
        <span class="muted" id="count"></span><span style="flex:1"></span>
        <button class="btn btn-line" id="csv">Copiar como CSV</button>
        <button class="btn btn-ghost" id="out">Salir</button>
      </div>
      <p class="err" id="err" hidden></p>
      <div class="table-wrap" id="tw" hidden><table><thead><tr>
        <th>Fecha</th><th>Nombre</th><th>Contacto</th><th>Equipo · ciudad</th><th>Perfil</th><th>Necesidades</th><th>Plan sugerido</th><th>Mensaje</th>
      </tr></thead><tbody id="rows"></tbody></table></div>
    </div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'salavideo:coachkey';
  // la clave solo se guarda mientras la pestaña esté abierta
  let key = ''; try { localStorage.removeItem(KEY); key = sessionStorage.getItem(KEY) || ''; } catch (e) {}
  let leads = [];
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const err = m => { $('err').textContent = m || ''; $('err').hidden = !m; };
  async function load() {
    err('');
    const r = await fetch('/api/leads', { headers: { 'x-coach-key': key } });
    if (r.status === 401) { key = ''; try { sessionStorage.removeItem(KEY); } catch (e) {} $('keyForm').hidden = false; $('bar').hidden = true; $('tw').hidden = true; err('Clave incorrecta.'); return; }
    if (!r.ok) { err(r.status === 429 ? 'Demasiados intentos. Espera 15 minutos.' : 'No se pudieron cargar las solicitudes.'); return; }
    leads = (await r.json()).leads || [];
    try { sessionStorage.setItem(KEY, key); } catch (e) {}
    $('keyForm').hidden = true; $('bar').hidden = false; $('tw').hidden = false;
    $('count').textContent = leads.length === 1 ? '1 solicitud' : `${leads.length} solicitudes`;
    $('rows').innerHTML = leads.length ? leads.map(l => {
      const d = new Date(l.created_at);
      const when = d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
      return `<tr><td class="when">${esc(when)}</td><td>${esc(l.nombre)}<br><span class="faint">${esc(l.rol)}</span></td>
        <td>${esc(l.whatsapp)}${l.whatsapp && l.correo ? '<br>' : ''}${esc(l.correo)}</td>
        <td>${esc(l.equipo)}${l.ciudad ? '<br><span class="faint">' + esc(l.ciudad) + '</span>' : ''}</td>
        <td>${esc((l.categoria || []).join(', '))}<br><span class="faint">${esc(l.equipos)} equipo(s) · ${esc(l.grabacion)} · usa: ${esc(l.herramienta)} · ${esc(l.presupuesto)}</span></td>
        <td>${esc((l.prioridad || []).join(', '))}</td><td>${esc(l.plan)}</td><td>${esc(l.mensaje)}</td></tr>`;
    }).join('') : '<tr><td colspan="8" class="muted">Todavía no hay solicitudes. Comparte la página de contacto.</td></tr>';
  }
  $('keyForm').onsubmit = e => { e.preventDefault(); key = $('key').value.trim(); if (key) load(); };
  $('out').onclick = () => { key = ''; try { sessionStorage.removeItem(KEY); } catch (e) {} location.reload(); };
  $('csv').onclick = async () => {
    const cols = ['created_at', 'nombre', 'rol', 'whatsapp', 'correo', 'equipo', 'ciudad', 'categoria', 'equipos', 'grabacion', 'herramienta', 'prioridad', 'presupuesto', 'plan', 'mensaje'];
    const q = v => { v = Array.isArray(v) ? v.join('; ') : String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const csv = [cols.join(','), ...leads.map(l => cols.map(c => q(c === 'created_at' ? new Date(l[c]).toISOString() : l[c])).join(','))].join('\n');
    try { await navigator.clipboard.writeText(csv); $('csv').textContent = 'Copiado'; setTimeout(() => $('csv').textContent = 'Copiar como CSV', 1500); } catch (e) { err('No se pudo copiar.'); }
  };
  if (key) load(); else $('keyForm').hidden = false;
})();
</script>
